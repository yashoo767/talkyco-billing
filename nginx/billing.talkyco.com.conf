# ─── Talkyco Billing — Nginx Configuration ───────────────────────────────
# Place this file at: /etc/nginx/sites-available/billing.talkyco.com
# Then: ln -s /etc/nginx/sites-available/billing.talkyco.com \
#              /etc/nginx/sites-enabled/billing.talkyco.com

# ── Rate limiting zones (defined in nginx.conf http block) ────────────────
# Add these to /etc/nginx/nginx.conf inside the http { } block:
#
#   limit_req_zone $binary_remote_addr zone=talkyco_global:10m rate=30r/m;
#   limit_req_zone $binary_remote_addr zone=talkyco_api:10m    rate=10r/m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  billing.talkyco.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  billing.talkyco.com;

    # ── SSL (managed by Certbot) ──────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/billing.talkyco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billing.talkyco.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

    # Hide server version
    server_tokens off;

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    application/atom+xml image/svg+xml;

    # ── Static assets (Next.js _next/static) ─────────────────────────────
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_cache_valid  200 365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header   Host $host;
    }

    # ── API routes — stricter rate limiting ───────────────────────────────
    location /api/ {
        limit_req zone=talkyco_api burst=5 nodelay;
        limit_req_status 429;

        proxy_pass             http://127.0.0.1:3000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     30s;
        proxy_connect_timeout  5s;
        proxy_send_timeout     30s;

        # Never forward internal headers to upstream
        proxy_hide_header      X-Powered-By;
        proxy_hide_header      Server;
    }

    # ── All other routes ──────────────────────────────────────────────────
    location / {
        limit_req zone=talkyco_global burst=20 nodelay;
        limit_req_status 429;

        proxy_pass             http://127.0.0.1:3000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     30s;
        proxy_hide_header      X-Powered-By;
        proxy_hide_header      Server;
    }

    # ── Block common scan paths ───────────────────────────────────────────
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    # ── Error pages ───────────────────────────────────────────────────────
    error_page 429 /429.html;
    location = /429.html {
        return 429 '{"error":"Too many requests. Please try again later.","code":"RATE_LIMITED"}';
        add_header Content-Type application/json;
    }
}
